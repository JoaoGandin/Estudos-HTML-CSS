<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!!</p>
    <script>
        // window.prompt retorna uma string, mesmo digitando um número.
        // var n1 = window.prompt("Digite um número: "); // String
        // var n2 = window.prompt("Digite outro número: "); // String
        var n1 = Number(window.prompt("Digite um número: ")); // number inteiro
        var n2 = Number(window.prompt("Digite outro número: ")); // number inteiro
        var soma = n1 + n2;
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${soma}`); // a forma como escrevemos aqui foi o "Template Strings", onde que tem que ser entre crases e utilizando os placeholders,${nome da variável vai aqui dentro das chaves}.
        // (number + number) para adição
        // (string + string) para concatenação
    </script>
</body>
</html>
